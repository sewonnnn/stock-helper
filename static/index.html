<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 멘토 AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23003fb1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>📈</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <!-- ══ 사이드바 ══ -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">
                    <svg width="22" height="22" fill="#fff" viewBox="0 0 24 24"><path d="M12 2a1 1 0 011 1v2h3a3 3 0 013 3v10a3 3 0 01-3 3H8a3 3 0 01-3-3V8a3 3 0 013-3h3V3a1 1 0 011-1zM8 7a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V8a1 1 0 00-1-1H8z"/><circle cx="9.5" cy="12" r="1.5"/><circle cx="14.5" cy="12" r="1.5"/><rect x="9" y="16" width="6" height="1.5" rx=".75"/><rect x="2" y="10" width="2" height="4" rx="1"/><rect x="20" y="10" width="2" height="4" rx="1"/></svg>
                </div>
                <div>
                    <div class="sidebar-logo-text">주식 멘토 AI</div>
                    <div class="sidebar-logo-sub">Stock Mentor AI</div>
                </div>
            </div>
            <button class="sidebar-newchat" onclick="newChat()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14m7-7H5"/></svg>
                New Chat
            </button>
            <div id="conversationList" class="sidebar-conversations"></div>
            <div class="sidebar-bottom">
                <div class="sidebar-help">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/></svg>
                    Help & Support
                </div>
            </div>
        </aside>

        <!-- ══ 사이드바 오버레이 (모바일) ══ -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <!-- ══ 메인 ══ -->
        <div class="main-wrapper">
        <div class="main">
            <header class="header">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div style="flex:1"></div>
                <div class="profile-circle">
                    <svg width="16" height="16" fill="#fff" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </header>

            <div class="chat-area" id="chatContainer">
                <div id="welcomeSection">
                    <div class="msg-wrapper">
                        <div class="msg-row">
                            <div class="ai-avatar">
                                <svg width="18" height="18" fill="#fff" viewBox="0 0 24 24"><path d="M12 2a1 1 0 011 1v2h3a3 3 0 013 3v10a3 3 0 01-3 3H8a3 3 0 01-3-3V8a3 3 0 013-3h3V3a1 1 0 011-1zM8 7a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V8a1 1 0 00-1-1H8z"/><circle cx="9.5" cy="12" r="1.5"/><circle cx="14.5" cy="12" r="1.5"/><rect x="9" y="16" width="6" height="1.5" rx=".75"/><rect x="2" y="10" width="2" height="4" rx="1"/><rect x="20" y="10" width="2" height="4" rx="1"/></svg>
                            </div>
                            <div class="ai-bubble-dark">안녕하세요! 주식 초보자를 위한 맞춤형 조언을 드리는 <strong>주식 멘토 AI</strong>입니다. 무엇을 도와드릴까요?</div>
                        </div>
                        <div class="msg-ts" style="margin-left:48px;">AI Assistant · Just now</div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:center;margin-top:40px;">
                        <div style="font-size:13px;color:#9ca3af;margin-bottom:16px;">아래 질문을 눌러보거나, 직접 입력해보세요</div>
                        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px;">
                            <button class="welcome-btn" onclick="askQuestion('애플 시가총액 알려줘')">애플 시가총액</button>
                            <button class="welcome-btn" onclick="askQuestion('테슬라 오늘 뉴스')">테슬라 오늘 뉴스</button>
                            <button class="welcome-btn" onclick="askQuestion('PER이 뭐야?')">PER이란?</button>
                            <button class="welcome-btn" onclick="askQuestion('엔비디아 분석해줘')">엔비디아 분석</button>
                            <button class="welcome-btn" onclick="askQuestion('공매도 위험성 알려줘')">공매도 위험성</button>
                            <button class="welcome-btn" onclick="askQuestion('24살이고 연봉 3200인데 투자 전략 알려줘')">연봉 3200 투자 전략</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ══ 하단 ══ -->
            <div class="bottom-bar">
                <div id="suggestionChips" style="display:none;margin-bottom:10px;overflow-x:auto;">
                    <div style="display:flex;gap:8px;padding-bottom:2px;justify-content:center;flex-wrap:wrap;">
                        <button class="welcome-btn" onclick="askQuestion('애플 시가총액 알려줘')" style="white-space:nowrap;flex-shrink:0">애플 시총</button>
                        <button class="welcome-btn" onclick="askQuestion('테슬라 오늘 뉴스')" style="white-space:nowrap;flex-shrink:0">테슬라 뉴스</button>
                        <button class="welcome-btn" onclick="askQuestion('PER이 뭐야?')" style="white-space:nowrap;flex-shrink:0">PER이란?</button>
                        <button class="welcome-btn" onclick="askQuestion('엔비디아 분석해줘')" style="white-space:nowrap;flex-shrink:0">엔비디아 분석</button>
                        <button class="welcome-btn" onclick="askQuestion('공매도 위험성 알려줘')" style="white-space:nowrap;flex-shrink:0">공매도 위험성</button>
                        <button class="welcome-btn" onclick="askQuestion('24살이고 연봉 3200인데 투자 전략 알려줘')" style="white-space:nowrap;flex-shrink:0">투자 전략</button>
                    </div>
                </div>
                <div class="input-bar">
                    <button class="input-plus"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14m7-7H5"/></svg></button>
                    <input id="questionInput" type="text" class="input-field" placeholder="종목 분석이나 투자 조언을 요청해보세요...">
                    <button id="sendBtn" class="input-send" onclick="handleSendClick()"><svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"/></svg></button>
                </div>
                <div class="disclaimer">주식 멘토 AI는 투자 결정을 돕기 위한 보조 도구입니다. 최종 결정은 투자자 본인에게 있습니다.</div>
            </div>
        </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
