<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 도우미 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-container { height: calc(100vh - 180px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold text-sm">AI</span>
            </div>
            <h1 class="text-xl font-bold text-gray-800">주식 도우미 AI</h1>
            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">국내 · 해외 주식</span>
        </div>
    </header>

    <!-- 면책문구 고정 배너 -->
    <div class="bg-amber-50 border-b border-amber-200 px-4 py-2 text-center">
        <span class="text-xs text-amber-700">본 내용은 투자 권유가 아닙니다. 투자 결정은 본인의 판단과 책임 하에 이루어져야 합니다.</span>
    </div>

    <!-- 메인 영역 -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- 채팅 메시지 영역 -->
        <div id="chatContainer" class="chat-container overflow-y-auto space-y-4 pb-4">
            <!-- 초기 안내 메시지 -->
            <div id="welcomeSection" class="text-center py-12">
                <h2 class="text-2xl font-bold text-gray-700 mb-2">주식 초보자를 위한 AI 어시스턴트</h2>
                <p class="text-gray-500 mb-8">국내 · 해외 주식에 대해 궁금한 것을 물어보세요</p>
                <!-- 추천 질문 버튼 -->
                <div class="flex flex-wrap justify-center gap-3" id="suggestions">
                    <button onclick="askQuestion('애플 시가총액 알려줘')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">애플 시가총액</button>
                    <button onclick="askQuestion('테슬라 오늘 뉴스')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">테슬라 오늘 뉴스</button>
                    <button onclick="askQuestion('PER이 뭐야?')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">PER이란?</button>
                    <button onclick="askQuestion('엔비디아 분석해줘')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">엔비디아 분석</button>
                    <button onclick="askQuestion('삼성전자 시가총액')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">삼성전자 시총</button>
                    <button onclick="askQuestion('공매도 위험성 알려줘')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">공매도 위험성</button>
                    <button onclick="askQuestion('20대에게 인기있는 국내 주식 추천해줘')" class="px-4 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition">20대 국내 인기 종목</button>
                </div>
            </div>
        </div>

        <!-- 입력 영역 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-4">
            <div class="max-w-4xl mx-auto flex gap-3">
                <input
                    id="questionInput"
                    type="text"
                    placeholder="질문을 입력하세요 (예: 애플 PER 어때?)"
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                />
                <button
                    id="sendBtn"
                    onclick="sendQuestion()"
                    class="px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-medium text-sm disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                    전송
                </button>
            </div>
        </div>
    </main>

    <script>
        let isLoading = false;
        let isComposing = false;  // 한글 IME 조합 상태

        // 한글 IME 조합 감지
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('questionInput');
            input.addEventListener('compositionstart', () => { isComposing = true; });
            input.addEventListener('compositionend', () => { isComposing = false; });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !isComposing) sendQuestion();
            });
        });

        function askQuestion(question) {
            document.getElementById('questionInput').value = question;
            sendQuestion();
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question || isLoading) return;

            // 환영 섹션 숨기기
            const welcome = document.getElementById('welcomeSection');
            if (welcome) welcome.remove();

            // 사용자 메시지 표시
            addUserMessage(question);
            input.value = '';
            input.blur();
            input.focus();
            isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            // 로딩 표시
            const loadingId = addLoadingMessage();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question }),
                });
                const result = await response.json();
                removeMessage(loadingId);

                if (result.success && result.data) {
                    addBotResponse(result.data);
                } else {
                    addErrorMessage(result.error || '응답을 생성할 수 없습니다.');
                }
            } catch (error) {
                removeMessage(loadingId);
                addErrorMessage('서버 연결에 실패했습니다.');
            } finally {
                isLoading = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function addUserMessage(text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'flex justify-end fade-in';
            div.innerHTML = `<div class="bg-blue-600 text-white px-4 py-2 rounded-2xl rounded-br-md max-w-md text-sm">${escapeHtml(text)}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addLoadingMessage() {
            const container = document.getElementById('chatContainer');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start fade-in';
            div.innerHTML = `<div class="bg-gray-200 text-gray-600 px-4 py-2 rounded-2xl rounded-bl-md text-sm"><span class="loading-dots">분석 중</span></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addErrorMessage(text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'flex justify-start fade-in';
            div.innerHTML = `<div class="bg-red-50 text-red-700 px-4 py-2 rounded-2xl rounded-bl-md text-sm border border-red-200">${escapeHtml(text)}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addBotResponse(data) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'flex justify-start fade-in w-full';
            div.innerHTML = `<div class="bg-white border border-gray-200 rounded-2xl rounded-bl-md p-5 max-w-2xl w-full shadow-sm">${renderResponse(data)}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderResponse(data) {
            let html = '';

            // 면책문구는 상단 고정 배너로 이동 (카드 내 생략)

            // 종목 정보
            if (data.종목) {
                html += `<div class="mb-4">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-bold text-lg text-gray-800">${escapeHtml(data.종목.ticker)}</span>
                        <span class="text-gray-500">·</span>
                        <span class="text-gray-600">${escapeHtml(data.종목.company_name)}</span>
                    </div>
                    ${data.종목.sector ? `<span class="text-xs text-gray-500">${escapeHtml(data.종목.sector)}${data.종목.industry ? ' / ' + escapeHtml(data.종목.industry) : ''}</span>` : ''}
                </div>`;
            }

            // 가격 카드
            if (data.가격) {
                const isUp = data.가격.change >= 0;
                const color = isUp ? 'text-green-600' : 'text-red-600';
                const bg = isUp ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200';
                const arrow = isUp ? '▲' : '▼';

                // 통화에 따른 가격 표시
                let priceDisplay = '';
                if (data.가격.currency === 'KRW') {
                    // 국내 주식: 원화만
                    priceDisplay = `${Math.round(data.가격.current_price).toLocaleString()}원`;
                } else if (data.가격.krw_price) {
                    // 해외 주식: 원화 우선 + 달러 부가
                    priceDisplay = `${Math.round(data.가격.krw_price).toLocaleString()}원 <span class="text-base text-gray-500">($${data.가격.current_price.toLocaleString()})</span>`;
                } else {
                    // 환율 정보 없는 경우 fallback
                    priceDisplay = `$${data.가격.current_price.toLocaleString()}`;
                }

                // 환율 정보
                const rateInfo = data.가격.usd_krw_rate ? `<div class="text-xs text-gray-400 mt-1">적용 환율: ${data.가격.usd_krw_rate.toLocaleString()}원/$</div>` : '';

                html += `<div class="p-4 rounded-xl border ${bg} mb-4">
                    <div class="flex items-baseline gap-3">
                        <span class="text-2xl font-bold text-gray-800">${priceDisplay}</span>
                        <span class="${color} font-medium">${arrow} ${Math.abs(data.가격.change_percent).toFixed(2)}%</span>
                    </div>
                    ${rateInfo}
                    ${data.가격.market_cap ? `<div class="mt-2 text-sm text-gray-600">시가총액 <span class="font-medium">${escapeHtml(data.가격.market_cap)}</span> ${data.가격.market_cap_tier ? `<span class="ml-1 px-2 py-0.5 bg-gray-200 rounded-full text-xs">${escapeHtml(data.가격.market_cap_tier)}</span>` : ''}</div>` : ''}
                </div>`;
            }

            // 52주 범위 바
            if (data.범위_52주) {
                const r = data.범위_52주;
                const pct = Math.min(Math.max(r.position_percent, 0), 100);
                html += `<div class="mb-4">
                    <div class="text-sm font-medium text-gray-700 mb-2">52주 범위</div>
                    <div class="relative h-2 bg-gray-200 rounded-full">
                        <div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-blue-600 rounded-full border-2 border-white shadow" style="left: ${pct}%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>$${r.low_52w.toLocaleString()}</span>
                        <span>$${r.high_52w.toLocaleString()}</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">${escapeHtml(r.interpretation)}</div>
                </div>`;
            }

            // 핵심지표 칩 그리드
            if (data.핵심지표 && data.핵심지표.length > 0) {
                html += `<div class="mb-4">
                    <div class="text-sm font-medium text-gray-700 mb-2">핵심 지표</div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">`;
                data.핵심지표.forEach(m => {
                    const levelColor = m.level === '높음' ? 'text-red-600 bg-red-50' : m.level === '낮음' ? 'text-blue-600 bg-blue-50' : 'text-gray-600 bg-gray-50';
                    html += `<div class="p-3 border border-gray-200 rounded-lg text-center">
                        <div class="text-xs text-gray-500">${escapeHtml(m.name)}</div>
                        <div class="font-bold text-gray-800 mt-0.5">${escapeHtml(m.value)}</div>
                        <div class="text-xs mt-0.5 px-1.5 py-0.5 rounded ${levelColor} inline-block">${escapeHtml(m.level)}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }

            // 회사 소개
            if (data.회사소개) {
                html += `<div class="mb-4">
                    <div class="text-sm font-medium text-gray-700 mb-1">회사 소개</div>
                    <div class="text-sm text-gray-600 leading-relaxed space-y-2">${formatSentences(data.회사소개)}</div>
                </div>`;
            }

            // 뉴스
            if (data.뉴스 && data.뉴스.length > 0) {
                html += `<div class="mb-4">
                    <div class="text-sm font-medium text-gray-700 mb-2">최근 뉴스</div>
                    <div class="space-y-2">`;
                data.뉴스.forEach(n => {
                    html += `<div class="p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <a href="${escapeHtml(n.url)}" target="_blank" class="text-sm font-medium text-blue-700 hover:underline">${escapeHtml(n.title)}</a>
                        <div class="text-xs text-gray-500 mt-1">${escapeHtml(n.source)}${n.published_at ? ' · ' + escapeHtml(n.published_at) : ''}</div>
                        ${n.summary ? `<p class="text-xs text-gray-600 mt-1">${escapeHtml(n.summary)}</p>` : ''}
                    </div>`;
                });
                html += `</div></div>`;
            }

            // 용어설명
            if (data.용어설명) {
                html += `<div class="mb-4">
                    <div class="text-sm font-medium text-gray-700 mb-1">용어 설명</div>
                    <div class="text-sm text-gray-600 leading-relaxed space-y-2">${formatSentences(data.용어설명)}</div>
                </div>`;
            }

            // 인사이트
            if (data.인사이트) {
                const isGeneral = !data.종목 && !data.가격;
                const title = isGeneral ? '검색 결과' : '핵심 인사이트';
                html += `<div class="mb-4 p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <div class="text-sm font-medium text-blue-800 mb-1">${title}</div>
                    <div class="text-sm text-blue-700 leading-relaxed space-y-2">${renderMarkdown(data.인사이트)}</div>
                </div>`;
            }

            // 출처 + 확신도
            if (data.출처 && data.출처.length > 0) {
                const sourceLinks = data.출처.map(s => {
                    if (s.startsWith('http')) {
                        try {
                            const domain = new URL(s).hostname.replace('www.', '');
                            return `<a href="${escapeHtml(s)}" target="_blank" class="text-gray-500 hover:text-blue-500 underline">${escapeHtml(domain)}</a>`;
                        } catch(e) {}
                    }
                    return escapeHtml(s);
                });
                html += `<div class="pt-3 border-t border-gray-100 text-xs text-gray-400">
                    <div class="mb-1">출처</div>
                    <div class="flex flex-wrap gap-x-3 gap-y-1">${sourceLinks.join('')}</div>
                    <div class="mt-1">확신도: ${escapeHtml(data.확신도)}</div>
                </div>`;
            }

            return html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function formatSentences(text) {
            if (!text) return '';
            // 줄바꿈이 이미 있으면 그대로 사용, 없으면 문장 단위로 분리
            const escaped = escapeHtml(text);
            if (escaped.includes('\n')) {
                return escaped.split('\n').filter(s => s.trim()).map(s => `<p>${s.trim()}</p>`).join('');
            }
            // 문장 끝(. 또는 다) 기준으로 분리
            const sentences = escaped.split(/(?<=[.다])\s+/);
            return sentences.filter(s => s.trim()).map(s => `<p>${s.trim()}</p>`).join('');
        }

        function renderMarkdown(text) {
            if (!text) return '';
            const escaped = escapeHtml(text);
            const lines = escaped.split('\n').filter(s => s.trim());
            return lines.map(line => {
                // **볼드** → <strong>
                let processed = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                // [텍스트](url) → <a> 링크
                processed = processed.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                    '<a href="$2" target="_blank" class="underline hover:text-blue-900">$1</a>');
                return `<p>${processed}</p>`;
            }).join('');
        }
    </script>
</body>
</html>
